<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Task 2: Non-preemptive CPU timeline, 0 to 40 milliseconds</title>
<desc id="desc">Five task lanes show execution, release arrows, and deadline triangles. Diagnostics runs from 9 to 15 milliseconds, blocking sensor and control jobs released at 10. They finish at 16 and 18.5, missing deadlines at 14 and 17. An idle lane shows unused CPU intervals.</desc>
