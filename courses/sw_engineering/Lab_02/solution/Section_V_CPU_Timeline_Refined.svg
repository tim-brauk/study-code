<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Refined CPU timeline: diagnostics split into two chunks</title>
<desc id="desc">Diagnostics executes at 9 to 12 and 15.5 to 18.5 milliseconds. Sensors released at 10 executes at 12 to 13; control at 13 to 15.5. All twelve jobs meet their deadlines.</desc>
<rect width="1440" height="650" fill="white"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d;font-size:14px}</style>
<text x="40" y="44" font-size="25" font-weight="600">Refined CPU timeline: diagnostics split into two 3 ms chunks</text>
<text x="40" y="76" >Non-preemptive chunks; scheduling decisions at chunk boundaries. All execution bars are drawn to scale.</text>
